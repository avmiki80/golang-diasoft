logger:
  level: INFO

http:
  host: 0.0.0.0
  port: 8080

database:
  type: db
  dsn: postgres://postgres:postgres@calendar-postgres:5432/calendar?sslmode=disable

kafka:
  bootstrap_servers: ["kafka:29092"]
  topic_configs:
    - name: calendar-notification-command-dlq
      partitions: 1
      replication_factor: 1
  producer:
    balancer: hash
    required_acks: 1
    max_attempts: 3
    batch_size: 100
    batch_timeout: 10
    compression: snappy
    async: false
  consumer:
    group_id: calendar_dlq_monitor_group
    auto_commit: true
    retry_enable: false
    max_attempts: 1
    initial_interval: 1
    max_interval: 10
    multiplier: 2.0
    max_elapsed_time: 30
